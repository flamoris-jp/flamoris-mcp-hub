[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flamoris-mcp-hub"
version = "1.0.0"
description = "Single-entry MCP hub for FLAMORIS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["flamoris-update-core[owner] @ https://github.com/flamoris-jp/flamoris-updater/archive/d5ec3408d2a9b43ce44efef6ab8209a6b8ffad25.zip#subdirectory=packages/update-core",
  "mcp>=2.2,<3",
  "httpx2>=2.5,<3",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.20,<5",
  "uvicorn>=0.31,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
flamoris-mcp-hub-update-owner = "flamoris_mcp_hub.updater:main"
flamoris-mcp-hub = "flamoris_mcp_hub.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flamoris_mcp_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.metadata]
allow-direct-references = true
