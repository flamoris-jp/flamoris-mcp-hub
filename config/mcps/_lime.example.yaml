# GPU Node Manager catalog for the LIME deployment; fixture provenance is pinned in tests/fixtures/lime-tools.json.
# Copy to lime.yaml and set your endpoint. The host is relative to the Hub runtime;
# container loopback is not the host loopback. No upstream Bearer auth is assumed.
{
  "id": "lime",
  "namespace": "lime",
  "enabled": true,
  "transport": "streamable-http",
  "url": "http://127.0.0.1:8766/mcp",
  "tools": [
    {
      "name": "runtime.list",
      "description": "List configured runtimes and their current authoritative status.",
      "input_schema": {
        "type": "object",
        "properties": {},
        "title": "runtime_listArguments"
      },
      "annotations": {
        "readOnlyHint": true,
        "destructiveHint": false,
        "openWorldHint": false
      }
    },
    {
      "name": "runtime.status",
      "description": "Inspect one configured runtime by its registry ID.",
      "input_schema": {
        "type": "object",
        "properties": {
          "runtime_id": {
            "title": "Runtime Id",
            "type": "string"
          }
        },
        "required": [
          "runtime_id"
        ],
        "title": "runtime_statusArguments"
      },
      "annotations": {
        "readOnlyHint": true,
        "destructiveHint": false,
        "openWorldHint": false
      }
    },
    {
      "name": "runtime.activate",
      "description": "Activate one enabled configured runtime through RuntimeManager.",
      "input_schema": {
        "type": "object",
        "properties": {
          "runtime_id": {
            "title": "Runtime Id",
            "type": "string"
          }
        },
        "required": [
          "runtime_id"
        ],
        "title": "runtime_activateArguments"
      },
      "annotations": {
        "readOnlyHint": false,
        "destructiveHint": true,
        "openWorldHint": false
      }
    },
    {
      "name": "runtime.stop",
      "description": "Stop one configured runtime through RuntimeManager.",
      "input_schema": {
        "type": "object",
        "properties": {
          "runtime_id": {
            "title": "Runtime Id",
            "type": "string"
          }
        },
        "required": [
          "runtime_id"
        ],
        "title": "runtime_stopArguments"
      },
      "annotations": {
        "readOnlyHint": false,
        "destructiveHint": true,
        "openWorldHint": false
      }
    },
    {
      "name": "system.status",
      "description": "Inspect current ownership, transitions, anomalies, and optional telemetry.",
      "input_schema": {
        "type": "object",
        "properties": {},
        "title": "system_statusArguments"
      },
      "annotations": {
        "readOnlyHint": true,
        "destructiveHint": false,
        "openWorldHint": false
      }
    }
  ]
}
