id: generation
namespace: generation
enabled: true
transport: streamable-http
url: https://lime.flamoris.net/generation-mcp/mcp
api_key_env: GENERATION_MCP_API_KEY
api_key_header: Authorization
api_key_prefix: 'Bearer '
tools:
- name: system.health
  description: Check the Generation MCP process and provider availability.
  input_schema:
    properties: {}
    title: healthArguments
    type: object
- name: capabilities.list
  description: List provider-independent generation capabilities.
  input_schema:
    properties: {}
    title: list_capabilitiesArguments
    type: object
- name: capabilities.get
  description: Inspect one generation capability.
  input_schema:
    properties:
      capability_id:
        title: Capability Id
        type: string
    required:
    - capability_id
    title: get_capabilityArguments
    type: object
- name: models.list
  description: List installed generation models, optionally filtered by kind.
  input_schema:
    properties:
      kind:
        anyOf:
        - enum:
          - checkpoint
          - lora
          - vae
          - controlnet
          - clip
          - clip_vision
          - diffusion_model
          - text_encoder
          - unet
          type: string
        - type: 'null'
        default: null
        title: Kind
    title: list_modelsArguments
    type: object
- name: models.get
  description: Inspect one installed generation model.
  input_schema:
    properties:
      model_id:
        title: Model Id
        type: string
    required:
    - model_id
    title: get_modelArguments
    type: object
- name: workflows.list
  description: List generation workflow templates and known workflow IDs.
  input_schema:
    properties: {}
    title: list_workflowsArguments
    type: object
- name: workflows.build
  description: Build a validated generation workflow from a built-in template or trusted definition.
  input_schema:
    type: object
    properties:
      template:
        title: Template
        type: string
      parameters:
        additionalProperties: true
        title: Parameters
        type: object
    required:
    - template
    - parameters
    title: build_workflowArguments
- name: workflows.save
  description: Persist a generation workflow recipe.
  input_schema:
    properties:
      workflow_id:
        title: Workflow Id
        type: string
    required:
    - workflow_id
    title: save_workflowArguments
    type: object
- name: jobs.submit
  description: Submit one generation workflow.
  input_schema:
    properties:
      workflow_id:
        title: Workflow Id
        type: string
    required:
    - workflow_id
    title: submit_jobArguments
    type: object
- name: jobs.status
  description: Poll the status of a generation job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: job_statusArguments
    type: object
- name: jobs.result
  description: Get result metadata for a generation job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: job_resultArguments
    type: object
- name: jobs.cancel
  description: Request cancellation of a generation job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: cancel_jobArguments
    type: object
- name: assets.list
  description: List generated asset metadata for a completed job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: list_assetsArguments
    type: object
- name: assets.get
  description: Return one generated asset as MCP-native media content.
  input_schema:
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: get_assetArguments
    type: object

