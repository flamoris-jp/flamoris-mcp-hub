id: generation
namespace: generation
enabled: true
transport: streamable-http
url: https://lime.flamoris.net/generation-mcp/mcp

# Secret value lives only in .env.
api_key_env: GENERATION_MCP_API_KEY
api_key_header: Authorization
api_key_prefix: "Bearer "

# Static API catalog exposed by the Hub even while this MCP is offline.
tools:
  - name: system.health
    description: Check the Generation MCP process and provider availability.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false

  - name: capabilities.list
    description: List provider-independent generation capabilities.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false

  - name: capabilities.get
    description: Inspect one generation capability.
    input_schema:
      type: object
      properties:
        capability_id:
          type: string
      required: [capability_id]
      additionalProperties: false

  - name: models.list
    description: List installed generation models, optionally filtered by kind.
    input_schema:
      type: object
      properties:
        kind:
          type: [string, "null"]
      additionalProperties: false

  - name: models.get
    description: Inspect one installed generation model.
    input_schema:
      type: object
      properties:
        model_id:
          type: string
      required: [model_id]
      additionalProperties: false

  - name: workflows.list
    description: List generation workflow templates and known workflow IDs.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false

  - name: workflows.build
    description: Build a validated generation workflow from a template and parameters.
    input_schema:
      type: object
      properties:
        template:
          type: string
        parameters:
          type: object
          additionalProperties: true
      required: [template, parameters]
      additionalProperties: false

  - name: workflows.save
    description: Persist a generation workflow recipe.
    input_schema:
      type: object
      properties:
        workflow_id:
          type: string
      required: [workflow_id]
      additionalProperties: false

  - name: jobs.submit
    description: Submit one generation workflow.
    input_schema:
      type: object
      properties:
        workflow_id:
          type: string
      required: [workflow_id]
      additionalProperties: false

  - name: jobs.status
    description: Poll the status of a generation job.
    input_schema:
      type: object
      properties:
        job_id:
          type: string
      required: [job_id]
      additionalProperties: false

  - name: jobs.result
    description: Get result metadata for a generation job.
    input_schema:
      type: object
      properties:
        job_id:
          type: string
      required: [job_id]
      additionalProperties: false

  - name: jobs.cancel
    description: Request cancellation of a generation job.
    input_schema:
      type: object
      properties:
        job_id:
          type: string
      required: [job_id]
      additionalProperties: false

  - name: assets.list
    description: List generated asset metadata for a completed job.
    input_schema:
      type: object
      properties:
        job_id:
          type: string
      required: [job_id]
      additionalProperties: false

  - name: assets.get
    description: Return one generated asset as MCP-native media content.
    input_schema:
      type: object
      properties:
        asset_id:
          type: string
      required: [asset_id]
      additionalProperties: false
