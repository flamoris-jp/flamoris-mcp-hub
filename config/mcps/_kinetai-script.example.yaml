# Inactive example: merge compile_script into the existing full companion registration.
# Keep existing connector settings and the five existing editing/preview tools.
id: kinetai
namespace: kinetai
transport: reverse-websocket
product_id: flamoris.kinetai
connector_token_env: KINETAI_CONNECTOR_TOKEN
tools:
- name: mcp.context
  description: Current live identity, revision and permission.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  input_schema:
    type: object
    additionalProperties: false
    properties: {}
- name: compile_script
  description: Compile bounded Python animation source to native motion IR without
    editing or saving. Commit program and source via edit_composition.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  input_schema:
    type: object
    properties:
      input:
        type: object
        additionalProperties: false
        required:
        - source
        properties:
          source:
            type: string
            maxLength: 65536
      guard:
        type: object
        additionalProperties: false
        properties:
          runtimeId:
            type: string
            minLength: 1
            maxLength: 128
          documentToken:
            type: string
            minLength: 1
            maxLength: 128
          expectedRevision:
            type: string
            pattern: ^(0|[1-9][0-9]*)$
            maxLength: 19
        required:
        - runtimeId
        - documentToken
    additionalProperties: false
    required:
    - input
