# Exact Generation catalog; update the deployed catalog in the same maintenance window.
id: generation
# Optional trusted per-client context; configure matched Generation verifier first.
# external_provenance_secret_env: GENERATION_PROVENANCE_SECRET
namespace: generation
enabled: true
transport: streamable-http
url: https://generation.example.com/mcp
tools:
- name: system.health
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Check the Generation MCP process and provider availability.
  input_schema:
    type: object
    properties: {}
    title: healthArguments
- name: capabilities.list
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: List provider-independent generation capabilities.
  input_schema:
    type: object
    properties: {}
    title: list_capabilitiesArguments
- name: capabilities.get
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Inspect one generation capability.
  input_schema:
    type: object
    properties:
      capability_id:
        title: Capability Id
        type: string
    required:
    - capability_id
    title: get_capabilityArguments
- name: models.list
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: List installed generation models, optionally filtered by kind.
  input_schema:
    type: object
    properties:
      kind:
        anyOf:
        - enum:
          - checkpoint
          - lora
          - vae
          - controlnet
          - clip
          - clip_vision
          - diffusion_model
          - text_encoder
          - unet
          type: string
        - type: 'null'
        default: null
        title: Kind
    title: list_modelsArguments
- name: models.get
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Inspect one installed generation model.
  input_schema:
    type: object
    properties:
      model_id:
        title: Model Id
        type: string
    required:
    - model_id
    title: get_modelArguments
- name: workflows.list
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: List graph-free descriptors with Generation-computed exact-identity
    readiness.
  input_schema:
    type: object
    properties: {}
    title: list_workflowsArguments
- name: workflows.register
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Statically validate and durably activate a trusted candidate; registration
    does not confer production readiness.
  input_schema:
    type: object
    properties:
      definition:
        additionalProperties: true
        title: Definition
        type: object
    required:
    - definition
    title: register_workflowArguments
- name: workflows.build
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Build a validated generation workflow from a built-in template or trusted
    definition.
  input_schema:
    type: object
    properties:
      template:
        title: Template
        type: string
      parameters:
        additionalProperties: true
        title: Parameters
        type: object
      definition_version:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Definition Version
      definition_digest:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Definition Digest
      require_ready:
        default: false
        title: Require Ready
        type: boolean
    required:
    - template
    - parameters
    title: build_workflowArguments
- name: workflows.verify
  description: Admit bounded automatic verification through the normal Generation
    job authority. Poll jobs.status/result; never replay uncertain work.
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  input_schema:
    type: object
    properties:
      workflow_id:
        title: Workflow Id
        type: string
      definition_version:
        title: Definition Version
        type: integer
      definition_digest:
        title: Definition Digest
        type: string
      parameters:
        additionalProperties: true
        title: Parameters
        type: object
    required:
    - workflow_id
    - definition_version
    - definition_digest
    - parameters
    title: verify_workflowArguments
- name: workflows.save
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Persist a generation workflow recipe.
  input_schema:
    type: object
    properties:
      workflow_id:
        title: Workflow Id
        type: string
    required:
    - workflow_id
    title: save_workflowArguments
- name: jobs.submit
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Submit one generation workflow.
  input_schema:
    type: object
    properties:
      workflow_id:
        title: Workflow Id
        type: string
    required:
    - workflow_id
    title: submit_jobArguments
- name: jobs.status
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Poll the status of a generation job.
  input_schema:
    type: object
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: job_statusArguments
- name: jobs.result
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Get result metadata for a generation job.
  input_schema:
    type: object
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: job_resultArguments
- name: jobs.cancel
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Request cancellation of a generation job.
  input_schema:
    type: object
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: cancel_jobArguments
- name: assets.list
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: List generated asset metadata for a completed job.
  input_schema:
    type: object
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: list_assetsArguments
- name: assets.get
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Return one generated asset as MCP-native media content.
  input_schema:
    type: object
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: get_assetArguments
- name: assets.prepare
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Materialize one asset for bounded transfer; return immutable content
    digest.
  input_schema:
    type: object
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: prepare_assetArguments
- name: assets.read
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Read at most 256 KiB from a prepared asset at a retryable byte offset.
  input_schema:
    type: object
    properties:
      asset_id:
        title: Asset Id
        type: string
      sha256:
        title: Sha256
        type: string
      offset:
        title: Offset
        type: integer
      length:
        default: 262144
        title: Length
        type: integer
    required:
    - asset_id
    - sha256
    - offset
    title: read_assetArguments
- name: assets.delete
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Delete one Hub-managed generated asset (not provider originals).
  input_schema:
    type: object
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: delete_assetArguments
- name: inputs.create
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Snapshot a generated image/audio asset as an immutable expiring input.
  input_schema:
    type: object
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: create_inputArguments
- name: inputs.get
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Inspect managed input metadata; an ID is not a Studio ownership grant.
  input_schema:
    type: object
    properties:
      input_id:
        title: Input Id
        type: string
    required:
    - input_id
    title: get_inputArguments
- name: inputs.delete
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Delete a managed snapshot unless a provider adapter is using it.
  input_schema:
    type: object
    properties:
      input_id:
        title: Input Id
        type: string
    required:
    - input_id
    title: delete_inputArguments
