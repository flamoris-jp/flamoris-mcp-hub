# Generation MCP catalog template.
# Copy this file to config/mcps/generation.yaml and set the URL for your deployment.
# Files beginning with "_" are ignored by the Hub.
id: generation
namespace: generation
enabled: true
transport: streamable-http
url: https://generation.example.com/mcp
# Optional bearer-token authentication. Uncomment only when the upstream
# deployment requires it, and keep the actual secret in .env.
# api_key_env: GENERATION_MCP_API_KEY
# api_key_header: Authorization
# api_key_prefix: 'Bearer '
tools:
- name: system.health
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Check the Generation MCP process and provider availability.
  input_schema:
    properties: {}
    title: healthArguments
    type: object
- name: capabilities.list
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: List provider-independent generation capabilities.
  input_schema:
    properties: {}
    title: list_capabilitiesArguments
    type: object
- name: capabilities.get
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Inspect one generation capability.
  input_schema:
    properties:
      capability_id:
        title: Capability Id
        type: string
    required:
    - capability_id
    title: get_capabilityArguments
    type: object
- name: models.list
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: List installed generation models, optionally filtered by kind.
  input_schema:
    properties:
      kind:
        anyOf:
        - enum:
          - checkpoint
          - lora
          - vae
          - controlnet
          - clip
          - clip_vision
          - diffusion_model
          - text_encoder
          - unet
          type: string
        - type: 'null'
        default: null
        title: Kind
    title: list_modelsArguments
    type: object
- name: models.get
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Inspect one installed generation model.
  input_schema:
    properties:
      model_id:
        title: Model Id
        type: string
    required:
    - model_id
    title: get_modelArguments
    type: object
- name: workflows.list
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: List generation workflow templates and known workflow IDs.
  input_schema:
    properties: {}
    title: list_workflowsArguments
    type: object
- name: workflows.register
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Validate, persist, and immediately activate a trusted generation workflow definition.
  input_schema:
    type: object
    properties:
      definition:
        additionalProperties: true
        title: Definition
        type: object
    required:
    - definition
    title: register_workflowArguments
- name: workflows.build
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Build a validated generation workflow from a built-in template or trusted definition.
  input_schema:
    type: object
    properties:
      template:
        title: Template
        type: string
      parameters:
        additionalProperties: true
        title: Parameters
        type: object
    required:
    - template
    - parameters
    title: build_workflowArguments
- name: workflows.save
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Persist a generation workflow recipe.
  input_schema:
    properties:
      workflow_id:
        title: Workflow Id
        type: string
    required:
    - workflow_id
    title: save_workflowArguments
    type: object
- name: jobs.submit
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Submit one generation workflow.
  input_schema:
    properties:
      workflow_id:
        title: Workflow Id
        type: string
    required:
    - workflow_id
    title: submit_jobArguments
    type: object
- name: jobs.status
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Poll the status of a generation job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: job_statusArguments
    type: object
- name: jobs.result
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Get result metadata for a generation job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: job_resultArguments
    type: object
- name: jobs.cancel
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Request cancellation of a generation job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: cancel_jobArguments
    type: object
- name: assets.list
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: List generated asset metadata for a completed job.
  input_schema:
    properties:
      job_id:
        title: Job Id
        type: string
    required:
    - job_id
    title: list_assetsArguments
    type: object
- name: assets.get
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Return one generated asset as MCP-native media content.
  input_schema:
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: get_assetArguments
    type: object
- name: assets.prepare
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Materialize one asset for bounded transfer; return immutable content digest.
  input_schema:
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: prepare_assetArguments
    type: object
- name: assets.read
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Read at most 256 KiB from a prepared asset at a retryable byte offset.
  input_schema:
    properties:
      asset_id:
        title: Asset Id
        type: string
      sha256:
        title: Sha256
        type: string
      offset:
        title: Offset
        type: integer
      length:
        default: 262144
        title: Length
        type: integer
    required:
    - asset_id
    - sha256
    - offset
    title: read_assetArguments
    type: object
- name: assets.delete
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Delete one Hub-managed generated asset (not provider originals).
  input_schema:
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: delete_assetArguments
    type: object
- name: inputs.create
  annotations:
    readOnlyHint: false
    destructiveHint: false
    openWorldHint: false
  description: Snapshot a generated image/audio asset as an immutable expiring input.
  input_schema:
    properties:
      asset_id:
        title: Asset Id
        type: string
    required:
    - asset_id
    title: create_inputArguments
    type: object
- name: inputs.get
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  description: Inspect managed input metadata; an ID is not a Studio ownership grant.
  input_schema:
    properties:
      input_id:
        title: Input Id
        type: string
    required:
    - input_id
    title: get_inputArguments
    type: object
- name: inputs.delete
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: false
  description: Delete a managed snapshot unless a provider adapter is using it.
  input_schema:
    properties:
      input_id:
        title: Input Id
        type: string
    required:
    - input_id
    title: delete_inputArguments
    type: object
