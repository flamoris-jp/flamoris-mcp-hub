services:
  mcp-hub:
    build:
      context: .
    container_name: flamoris-mcp-hub
    restart: unless-stopped
    environment:
      FLAMORIS_MCP_HUB_CONFIG_DIR: /app/config/mcps
      FLAMORIS_MCP_HUB_ENV_FILE: /app/.env
    volumes:
      - ./config/mcps:/app/config/mcps:ro
      - ./.env:/app/.env:ro
    ports:
      - "${FLAMORIS_MCP_HUB_PORT:-8765}:8765"
